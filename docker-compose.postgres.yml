name: micro-fleet-postgres
services:
  postgres:
    image: postgres:16-bookworm
    container_name: micro-fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-micro_fleet}
      POSTGRES_USER: ${POSTGRES_USER:-mf_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      MF_APP_PASSWORD: ${MF_APP_PASSWORD:?Define MF_APP_PASSWORD en .env}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - micro_fleet_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
      - ./infra/postgres/002_set_password.sh:/docker-entrypoint-initdb.d/002_set_password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    shm_size: 256mb
    stop_grace_period: 60s
    networks: [micro-fleet-db]
volumes:
  micro_fleet_pgdata:
    name: micro_fleet_pgdata
networks:
  micro-fleet-db:
    name: micro-fleet-db
